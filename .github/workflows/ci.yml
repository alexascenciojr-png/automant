name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas y cobertura (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test   # falla si la cobertura baja de 80 %
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/lcov.info }

  sonar:
    name: Calidad (SonarQube)
    needs: test
    runs-on: ubuntu-latest
    if: ${{ vars.SONAR_ENABLED == 'true' }}   # actívalo al configurar SONAR_TOKEN y SONAR_HOST_URL
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: coverage, path: coverage }
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  zap:
    name: Seguridad (OWASP ZAP)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: nohup node src/server.js > server.log 2>&1 &
        env: { DB_FILE: ':memory:', PORT: 3000 }
      - run: npx --yes wait-on http://localhost:3000
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          allow_issue_writing: false
          fail_action: false

  deploy:
    name: Despliegue a entorno de prueba
    needs: [test, zap]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
